# Spring Boot Application Configuration
spring.application.name=campusguard-backend
server.port=8080

# Default to development profile (SQLite)
# To switch to production (PostgreSQL), run with --spring.profiles.active=prod or set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# CORS configuration for Next.js frontend
campusguard.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
