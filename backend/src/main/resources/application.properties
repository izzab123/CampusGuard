# Spring Boot Application Configuration
spring.application.name=campusguard-backend
server.port=8080

# Default to development profile (SQLite)
# To switch to production (PostgreSQL), run with --spring.profiles.active=prod or set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# CORS configuration for Next.js frontend
campusguard.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# App Frontend URL for Password Reset Links
campusguard.frontend.url=http://localhost:3000

# Mail Configuration (Supports Gmail, Mailtrap, or any SMTP provider)
# If credentials are not provided or connection fails, the reset link is safely logged to console.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
